memory_limit = 512M
post_max_size = 500M
upload_max_filesize = 500M
max_execution_time = 300
max_input_time = 300

; Enable display of errors (for development, consider setting to Off in production)
display_errors = On

; Enable error logging
log_errors = On
error_log = /logs/php_error.log
error_reporting = E_ALL
