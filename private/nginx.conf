server {
    listen 443 ssl default_server;
    http2 on;
    root /app;
    ssl_certificate /ssl/cert.pem;
    ssl_certificate_key /ssl/key.pem;
    autoindex off;

    # Remove server tokens for security
    server_tokens off;

    # Allow large uploads
    client_max_body_size 500M;

    # Deny direct access to physical storage paths
    location ^~ /storage/ {
        deny all;
        return 404;
    }
    location = /storage { return 404; }
    location ~ /\. { return 404; }

    # Execute only the application entry point; never other PHP files/templates.
    location = /index.php {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }
    location ~* \.(?:php|phtml|phar)(?:/|$) { return 404; }

    # Add gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_comp_level 5;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_http_version 1.1;
    gzip_vary on;

    # Handle image requests with dynamic processing
    location ~ ^/global/files/(.+\.(jpg|jpeg|png|gif|webp))$ {
        # Add caching directives to this specific location block**
        expires 365d;
        add_header Cache-Control "public, no-transform, max-age=31536000";

        set $filename $1;
        set $site_url "$scheme://$http_host";

        # If there are query parameters, proxy to PHP API
        if ($args != "") {
            return 302 $site_url/ohcrud/files/image?filename=$1&$args;
        }

        # Otherwise, serve the file directly
        try_files $uri = 404;
    }

    # Dynamic revalidation for CSS and JavaScript to prevent stale browser caching
    location ~* ^/(?:themes|global)/.+\.(?:css|js)$ {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Non-image CMS uploads are downloadable documents, not executable pages.
    location ~* ^/global/files/.+\.(?:csv|txt|pdf|xml|xlsx|json|zip|mp3)$ {
        try_files $uri =404;
        add_header Content-Disposition attachment;
        add_header Content-Security-Policy "sandbox; default-src 'none'";
        add_header X-Content-Type-Options nosniff;
    }

    # Uploaded SVG documents need isolation even when requested directly.
    location ~* ^/global/files/.+\.svg$ {
        try_files $uri =404;
        add_header Content-Disposition attachment;
        add_header Content-Security-Policy "sandbox; default-src 'none'";
        add_header X-Content-Type-Options nosniff;
    }

    # Add Cache-Control for static media and font assets
    location ~* ^/(?:themes|global)/.+\.(?:jpg|jpeg|png|gif|ico|svg|webp|avif|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, no-transform, max-age=31536000";
    }

    # All remaining paths are virtual routes, never direct reads of source files.
    location / {
        rewrite ^ /index.php last;
    }
}
