# Example: Nginx behind Tailscale Serve on the same server.
# Replace @ALTUS_ROOT@ with the absolute checkout directory before enabling.
# setup.sh does not install or enable this file.
server {
    listen 127.0.0.1:8080;
    server_name _;
    root @ALTUS_ROOT@/public;
    server_tokens off;
    autoindex off;
    client_max_body_size 512M;

    location ^~ /storage/ {
        deny all;
        return 404;
    }
    location = /storage { return 404; }
    location ~ /\. { return 404; }

    # Only the front controller may execute PHP.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        # HTTPS is terminated by the trusted, local Tailscale Serve proxy.
        # For direct TLS termination in Nginx, use: fastcgi_param HTTPS $https;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/altus.sock;
        fastcgi_read_timeout 300s;
        fastcgi_request_buffering off;
        fastcgi_hide_header X-Powered-By;
    }
    location ~* \.(?:php|phtml|phar)(?:/|$) { return 404; }

    # Serve only frontend assets, not application source or dependency manifests.
    location ~* ^/(?:themes|global)/.+\.(?:css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~* ^/(?:themes|global)/.+\.(?:png|jpe?g|gif|webp|ico|svg|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }
    # Do not use try_files $uri here: PHP templates and settings must not be served.
    # Routes such as /ohcrud/admin/ are virtual, even though an ohcrud directory exists.
    location / {
        rewrite ^ /index.php last;
    }
}
