    <script>
    (function () {
        var theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        try {
            var saved = localStorage.getItem('altus_theme');
            if (saved === 'light' || saved === 'dark') theme = saved;
            var accent = localStorage.getItem('altus_accent');
            if (['blue', 'indigo', 'violet', 'rose', 'orange', 'amber', 'emerald', 'teal'].includes(accent)) document.documentElement.dataset.accent = accent;
        } catch (error) {}
        document.documentElement.dataset.theme = theme;
    })();
    </script>
